<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>命理顾问 · 双术互证 MVP</title>
<style>
  :root {
    --bg: #f7f5f0; --card: #ffffff; --ink: #2b2620; --muted: #8a8175;
    --accent: #9c4a2f; --accent-light: #f3e4dd; --line: #e8e2d8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", serif; background: var(--bg); color: var(--ink); line-height: 1.7; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px 20px 80px; }
  header { text-align: center; margin-bottom: 36px; }
  header h1 { font-size: 28px; letter-spacing: 8px; font-weight: 600; }
  header p { color: var(--muted); font-size: 13px; margin-top: 6px; letter-spacing: 2px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px; margin-bottom: 24px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; background: #fdfcfa; font-family: inherit; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .domains { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .domains label { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; font-size: 14px; cursor: pointer; user-select: none; }
  .domains input { display: none; }
  .domains input:checked + span { color: var(--accent); font-weight: 600; }
  .domains label:has(input:checked) { background: var(--accent-light); border-color: var(--accent); }
  .btn { display: block; width: 100%; margin-top: 24px; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 16px; letter-spacing: 6px; cursor: pointer; font-family: inherit; }
  .btn:hover { opacity: .92; }
  .btn:disabled { opacity: .5; cursor: wait; }
  .notice { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; }
  .chart-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
  .pillar { text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 10px 4px; background: #fdfcfa; }
  .pillar .t { font-size: 12px; color: var(--muted); }
  .pillar .gz { font-size: 20px; font-weight: 600; letter-spacing: 2px; }
  .zx-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .palace { display: inline-block; padding: 2px 8px; margin: 3px; background: #fdfcfa; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; }
  .report { white-space: normal; }
  .report h2, .report h3 { margin: 18px 0 8px; color: var(--accent); }
  .report table { border-collapse: collapse; width: 100%; margin: 10px 0; }
  .report th, .report td { border: 1px solid var(--line); padding: 8px 10px; font-size: 14px; text-align: left; }
  .fb-btn { padding: 6px 18px; margin: 0 4px; border: 1px solid var(--line); border-radius: 999px; background: #fdfcfa; font-size: 14px; cursor: pointer; font-family: inherit; }
  .fb-btn:hover { border-color: var(--accent); color: var(--accent); }
  .opt-btn { padding: 11px 16px; border: 1px solid var(--line); border-radius: 8px; background: #fdfcfa; font-size: 14px; cursor: pointer; font-family: inherit; text-align: left; }
  .opt-btn:hover { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
  .conf-chip { display: inline-block; padding: 3px 12px; margin: 4px 6px 0 0; border-radius: 999px; font-size: 13px; border: 1px solid var(--line); background: #fdfcfa; }
  .conf-chip.high { background: #eef4ea; border-color: #b7cfab; color: #4a6b3a; }
  .conf-chip.medium { background: #f7f1e6; border-color: #ddc9a3; color: #8a6d2f; }
  .conf-chip.conditional { background: #f3e8ee; border-color: #cfa8c0; color: #8a4a6b; }
  .conf-chip.neutral { background: #f0f0ee; border-color: #d5d5d0; color: #777; }
  .status { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; letter-spacing: 2px; }
  .err { color: #b03a2e; background: #fdeeec; border: 1px solid #f0c4bd; border-radius: 8px; padding: 12px 16px; font-size: 14px; }
  .disclaimer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 40px; border-top: 1px solid var(--line); padding-top: 20px; letter-spacing: 1px; }

  /* ───── 历史档案面板 ───── */
  .hist-toggle { position: fixed; top: 20px; right: 20px; padding: 9px 18px; background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px; font-size: 13px; cursor: pointer; font-family: inherit;
    box-shadow: 0 2px 8px rgba(0,0,0,.06); z-index: 40; }
  .hist-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .hist-toggle .n { color: var(--accent); font-weight: 600; }
  .drawer-mask { position: fixed; inset: 0; background: rgba(43,38,32,.28); z-index: 50; display: none; }
  .drawer-mask.on { display: block; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: 480px; max-width: 92vw; background: var(--bg);
    z-index: 60; transform: translateX(100%); transition: transform .22s ease; display: flex; flex-direction: column;
    box-shadow: -4px 0 20px rgba(0,0,0,.12); }
  .drawer.on { transform: translateX(0); }
  .drawer-head { padding: 20px 22px 14px; border-bottom: 1px solid var(--line); background: var(--card); }
  .drawer-head h2 { font-size: 17px; letter-spacing: 3px; margin-bottom: 4px; }
  .drawer-head .sub { font-size: 12px; color: var(--muted); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 16px 22px 30px; }
  .hist-search { display: flex; gap: 8px; margin-bottom: 12px; }
  .hist-search input { flex: 1; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; background: #fdfcfa; font-family: inherit; }
  .hist-search input:focus { outline: none; border-color: var(--accent); }
  .hist-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { padding: 5px 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--card);
    font-size: 12px; cursor: pointer; font-family: inherit; color: var(--muted); }
  .chip.on { background: var(--accent-light); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .hist-item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
    margin-bottom: 10px; cursor: pointer; }
  .hist-item:hover { border-color: var(--accent); }
  .hist-item .l1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .hist-item .who { font-size: 14px; font-weight: 600; }
  .hist-item .when { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .hist-item .l2 { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.6; }
  .hist-item .note { font-size: 12px; color: var(--accent); margin-top: 4px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; margin-left: 6px; }
  .badge.good { background: #eef4ea; color: #4a6b3a; border: 1px solid #b7cfab; }
  .badge.bad  { background: #fdeeec; color: #b03a2e; border: 1px solid #f0c4bd; }
  .badge.none { background: #f5f3ef; color: var(--muted); border: 1px solid var(--line); }
  .hist-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 50px 0; line-height: 2; }
  .badge.facts { background: #fdf6e8; color: #8a6d2f; border: 1px solid #ecdcb8; }
  .hist-actions { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); align-items: center; }
  .hist-actions .spacer { flex: 1; }
  .mini-btn { padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fdfcfa;
    font-size: 13px; cursor: pointer; font-family: inherit; }
  .mini-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mini-btn.danger:hover { border-color: #b03a2e; color: #b03a2e; }
  .note-input { width: 100%; margin-top: 8px; padding: 8px 12px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 13px; background: #fdfcfa; font-family: inherit; }
  .note-input:focus { outline: none; border-color: var(--accent); }
@media (max-width: 640px) { .hist-toggle { top: 12px; right: 12px; padding: 7px 14px; font-size: 12px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>命理顾问</h1>
    <p>八字 · 紫微斗数 双术排盘 / 排盘由确定性算法计算，解读由 AI 受约束生成</p>
  </header>

  <div class="card">
    <div class="form-grid">
      <div class="field">
        <label>出生日期（公历）</label>
        <input type="date" id="date" required>
      </div>
      <div class="field">
        <label>出生时辰（不确定选「未知」）</label>
        <select id="hour">
          <option value="rectify">不确定 / 帮我定盘（回答几个问题推算）</option>
          <option value="">未知（直接按三柱解读）</option>
          <option value="0">子时 00-01</option><option value="1">丑时 01-03</option>
          <option value="2">寅时 03-05</option><option value="3">卯时 05-07</option>
          <option value="4">辰时 07-09</option><option value="5">巳时 09-11</option>
          <option value="6">午时 11-13</option><option value="7">未时 13-15</option>
          <option value="8">申时 15-17</option><option value="9">酉时 17-19</option>
          <option value="10">戌时 19-21</option><option value="11">亥时 21-23</option>
          <option value="23">晚子时 23-24</option>
        </select>
      </div>
      <div class="field">
        <label>性别</label>
        <select id="gender"><option>男</option><option>女</option></select>
      </div>
      <div class="field">
        <label>出生城市（真太阳时校正）</label>
        <input type="text" id="city" placeholder="如：深圳" list="cities">
        <datalist id="cities"></datalist>
      </div>
    </div>
    <div class="field" style="margin-top:16px">
      <label>想了解的领域（可多选）</label>
      <div class="domains">
        <label><input type="checkbox" value="career" checked><span>事业</span></label>
        <label><input type="checkbox" value="wealth" checked><span>财帛</span></label>
        <label><input type="checkbox" value="marriage" checked><span>婚姻</span></label>
        <label><input type="checkbox" value="health"><span>健康</span></label>
        <label><input type="checkbox" value="annual"><span>流年</span></label>
      </div>
    </div>
    <button class="btn" id="go">开始排盘解读</button>
    <p class="notice">排盘不经过 AI（确定性算法）· 解读附盘面依据与古籍条文出处 · 双术互证分级置信度</p>
  </div>

  <div id="result"></div>

  <p class="disclaimer">本工具输出为传统文化 / 娱乐参考，不构成医疗、投资、婚姻等重大决策建议。</p>
</div>

<button class="hist-toggle" id="hist-toggle" onclick="toggleHistory()">历史档案 <span class="n" id="hist-count">0</span></button>
<div class="drawer-mask" id="hist-mask" onclick="toggleHistory(false)"></div>
<aside class="drawer" id="hist-drawer" aria-label="历史档案">
  <div class="drawer-head">
    <h2>历史档案</h2>
    <p class="sub" id="hist-sub">每次解读自动归档 · 可按姓名、城市、四柱、报告正文全文检索</p>
  </div>
  <div class="drawer-body">
    <div class="hist-search">
      <input type="text" id="hist-q" placeholder="搜索：备注 / 城市 / 日主 / 命宫主星 / 报告正文" onkeydown="if(event.key==='Enter')loadHistory()">
      <button class="mini-btn" onclick="loadHistory()">搜索</button>
    </div>
    <div class="hist-filters" id="hist-filters">
      <button class="chip on" data-rating="" onclick="pickRating('')">全部</button>
      <button class="chip" data-rating="good" onclick="pickRating('good')">有帮助</button>
      <button class="chip" data-rating="bad" onclick="pickRating('bad')">不准</button>
      <button class="chip" data-rating="unrated" onclick="pickRating('unrated')">待评价</button>
    </div>
    <div id="hist-list"><div class="hist-empty">加载中…</div></div>
  </div>
</aside>

<script>
// 城市清单的唯一真相在后端 CITY_LONGITUDE（GET /api/cities）。
// 这里只在后端取不到时兜底，避免前后端各存一份、改了后端前端还显示旧清单。
const CITIES_FALLBACK = ["北京","上海","广州","深圳","杭州","成都","重庆","武汉","西安","南京","苏州","天津","长沙","郑州","青岛","厦门","福州","沈阳","哈尔滨","乌鲁木齐","拉萨","昆明","贵阳","兰州","海口","香港","澳门","台北"];
document.getElementById('cities').innerHTML = CITIES_FALLBACK.map(c => `<option value="${c}">`).join('');
document.getElementById('date').value = '1995-06-15';

// 用后端城市表覆盖兜底清单（服务未启动时静默降级，不挡住页面）
fetch('/api/cities').then(r => r.ok ? r.json() : null).then(d => {
  if (!d || !Array.isArray(d.cities) || !d.cities.length) return;
  document.getElementById('cities').innerHTML =
    d.cities.map(c => `<option value="${esc(c.name)}">`).join('');
}).catch(() => { /* 服务未启动，保留兜底清单 */ });

function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }

// ───────── 定盘流程 ─────────
let rectifyState = null; // { sessionId, question, done, result }

function renderRectify() {
  const result = document.getElementById('result');
  const st = rectifyState;
  if (st.done) {
    const r = st.result;
    const color = r.level === 'high' ? 'high' : r.level === 'medium' ? 'medium' : 'conditional';
    result.innerHTML = `<div class="card">
      <h3 style="color:var(--accent);letter-spacing:4px;margin-bottom:8px">定盘结果</h3>
      <p style="font-size:22px;font-weight:600;letter-spacing:2px">${r.hour} 时左右</p>
      <p style="margin-top:6px"><span class="conf-chip ${color}">把握 ${(r.posterior * 100).toFixed(0)}%　用了 ${r.questionsUsed} 个问题</span></p>
      <p style="font-size:13px;color:var(--muted);margin-top:10px">${esc(r.note)}</p>
      ${r.runnerUp ? `<p style="font-size:12px;color:var(--muted)">次选：${r.runnerUp.hour} 时（${(r.runnerUp.posterior * 100).toFixed(0)}%）</p>` : ''}
      <button class="btn" style="margin-top:20px" onclick="startInterpret(${r.hour})">按此时辰开始解读</button>
      <button class="btn" style="margin-top:10px;background:#8a8175" onclick="startInterpret(null)">仍按「时辰未知」解读</button>
    </div>`;
    return;
  }
  const q = st.question;
  let opts = '';
  if (q.type === 'decadal') {
    opts = q.topicOptions.map(o =>
      `<button class="opt-btn" onclick="answerRectify('${o.key}')">${esc(o.label)}</button>`).join('');
  } else {
    opts = `<button class="opt-btn" onclick="answerRectify('yes')">有</button>
            <button class="opt-btn" onclick="answerRectify('no')">没有</button>
            <button class="opt-btn" onclick="answerRectify('unsure')">记不清</button>`;
  }
  const bar = st.posterior.slice(0, 4).map(p =>
    `<span class="conf-chip">${esc(p.label)} ${(p.posterior * 100).toFixed(0)}%</span>`).join('');
  result.innerHTML = `<div class="card">
    <h3 style="color:var(--accent);letter-spacing:4px;margin-bottom:4px">定盘（推算出生时辰）</h3>
    <p style="font-size:12px;color:var(--muted);margin-bottom:14px">
      出生时辰决定命宫，紫微十二宫随之全部重排。通过你过往的真实经历反推，比直接回忆更可靠。
      ${st.qCount ? `已回答 ${st.qCount} 题` : ''}
    </p>
    <p style="font-size:17px;margin-bottom:16px;line-height:1.8">${esc(q.text)}</p>
    <div style="display:flex;flex-direction:column;gap:8px">${opts}</div>
    <div style="margin-top:18px;border-top:1px dashed var(--line);padding-top:12px">
      <p style="font-size:12px;color:var(--muted);margin-bottom:6px">当前推算倾向：</p>${bar}
    </div>
    <p style="font-size:12px;color:var(--muted);margin-top:14px">都不符合也没关系——这恰恰说明此盘与你的经历吻合度低，我们会据此下调结论的把握。</p>
  </div>`;
}

async function answerRectify(ans) {
  const result = document.getElementById('result');
  result.innerHTML = '<div class="card status">推算中…</div>';
  const resp = await fetch('/api/rectify/answer', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sessionId: rectifyState.sessionId, question: rectifyState.question, answer: ans }),
  });
  const data = await resp.json();
  if (data.error) { result.innerHTML = `<div class="card err">${esc(data.error)}</div>`; return; }
  rectifyState = { ...rectifyState, ...data, qCount: data.asked };
  renderRectify();
}

async function startRectify(payload) {
  const result = document.getElementById('result');
  result.innerHTML = '<div class="card status">正在生成定盘问题…</div>';
  const resp = await fetch('/api/rectify/start', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dateStr: payload.dateStr, gender: payload.gender, city: payload.city }),
  });
  const data = await resp.json();
  if (data.error) { result.innerHTML = `<div class="card err">${esc(data.error)}</div>`; return; }
  if (!data.question) {
    result.innerHTML = `<div class="card err">可用于定盘的人生区间不足（年龄太小）。请直接选择时辰或按「未知」解读。</div>`;
    return;
  }
  rectifyState = data;
  window._rectifyPayload = payload;
  renderRectify();
}

/** 定盘完成后（或跳过定盘）进入正式解读 */
async function startInterpret(hour) {
  const p = window._rectifyPayload;
  await runInterpret({
    dateStr: p.dateStr, hour, gender: p.gender, city: p.city,
    domains: p.domains, rectified: hour != null,
  });
}
function mdLite(t){
  let h = esc(t);
  h = h.replace(/^### (.+)$/gm, '<h3>$1</h3>').replace(/^## (.+)$/gm, '<h2>$1</h2>').replace(/^# (.+)$/gm, '<h2>$1</h2>');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/^【(.+?)】/gm, '<strong>【$1】</strong>');
  // 简易表格
  h = h.replace(/((?:^\|.+\|$\n?)+)/gm, m => {
    const rows = m.trim().split('\n').map(r => r.split('|').slice(1, -1).map(c => c.trim()));
    if (rows.length < 2) return m;
    const [head, , ...body] = rows;
    return '<table><tr>' + head.map(c=>`<th>${c}</th>`).join('') + '</tr>' +
      body.map(r => '<tr>' + r.map(c=>`<td>${c}</td>`).join('') + '</tr>').join('') + '</table>';
  });
  return h.replace(/\n/g, '<br>');
}

async function sendFeedback(rating) {
  const area = document.getElementById('fb-area');
  const factsEl = document.getElementById('fb-facts');
  const facts = factsEl ? factsEl.value.trim() : '';
  const sessionId = window._lastSessionId || null;
  try {
    const resp = await fetch('/api/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...window._lastPayload, sessionId, rating, facts }) });
    const d = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(d.error || ('HTTP ' + resp.status));
    // feedback.jsonl 是不可变审计流水；同时后端会把结构化结论回写进档案，便于日后按「不准」检索
    area.innerHTML = '<span style="font-size:13px;color:var(--accent)">已记录，感谢反馈（用于校正解读规则）'
      + (d.linked ? ' · 已关联到本次档案' : '') + '</span>';
    if (sessionId) refreshHistCount();
  } catch (e) {
    area.innerHTML = `<span style="font-size:13px;color:#b03a2e">反馈失败：${esc(e.message)}</span>`;
  }
}

document.getElementById('go').addEventListener('click', async () => {
  const date = document.getElementById('date').value;
  const hourRaw = document.getElementById('hour').value;
  const gender = document.getElementById('gender').value;
  const city = document.getElementById('city').value.trim();
  const domains = [...document.querySelectorAll('.domains input:checked')].map(i => i.value);
  if (!date) { document.getElementById('result').innerHTML = '<div class="card err">请先选择出生日期</div>'; return; }
  const payload = { dateStr: date, gender, city, domains };

  // 时辰不确定 → 进入定盘问答流程
  if (hourRaw === 'rectify') { window._rectifyPayload = payload; return startRectify(payload); }
  await runInterpret({ ...payload, hour: hourRaw === '' ? null : Number(hourRaw) });
});

// ───────── 澄清闸（调用前硬门禁） ─────────
let clarifyAnswers = {};

function renderClarify(payload, pre) {
  const result = document.getElementById('result');
  const blocks = pre.blocking.map((b, i) => {
    const opts = (b.options || []).map(o =>
      `<button class="opt-btn" data-f="${esc(b.field)}" data-v="${esc(o.value)}"
         onclick="pickClarify('${esc(b.field)}','${esc(o.value)}')">${esc(o.label)}${o.hint
           ? `<span style="display:block;font-size:12px;color:var(--muted);margin-top:3px">${esc(o.hint)}</span>` : ''}</button>`
    ).join('');
    const extra = (b.input && b.input.type === 'text')
      ? `<input id="clarify-in-${i}" type="text" list="cities" placeholder="${esc(b.input.placeholder || '')}"
           style="margin-top:8px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fdfcfa;font-family:inherit">`
      : '';
    return `<div style="margin-bottom:20px">
      <p style="font-size:15px;line-height:1.8;margin-bottom:8px">${esc(b.question)}</p>
      <div style="display:flex;flex-direction:column;gap:8px">${opts}</div>${extra}</div>`;
  }).join('');

  const warns = (pre.warnings || []).map(w => `<p style="font-size:12px;color:var(--muted);margin-top:4px">· ${esc(w)}</p>`).join('');
  result.innerHTML = `<div class="card">
    <h3 style="color:var(--accent);letter-spacing:4px;margin-bottom:4px">排盘前需要你确认</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:20px">
      下面这几项会直接改变排盘结果。系统不替你猜默认值——排盘错误是静默的，报告越流畅就越危险。
    </p>
    ${blocks}
    ${warns ? `<div style="border-top:1px dashed var(--line);padding-top:12px;margin-bottom:16px">${warns}</div>` : ''}
    <button class="btn" onclick="submitClarify()">确认并继续排盘</button>
    <button class="btn" style="margin-top:10px;background:#8a8175" onclick="skipClarify()">按默认口径继续（精度下降）</button>
  </div>`;
  window._clarifyPayload = payload;
  window._clarifyBlocking = pre.blocking;
  clarifyAnswers = {};
  document.getElementById('go').disabled = false;
}

function pickClarify(field, value) {
  clarifyAnswers[field] = value;
  document.querySelectorAll(`[data-f="${field}"]`).forEach(b => {
    b.style.borderColor = ''; b.style.background = ''; b.style.color = '';
  });
  const btn = document.querySelector(`[data-f="${field}"][data-v="${value}"]`);
  if (btn) { btn.style.borderColor = 'var(--accent)'; btn.style.background = 'var(--accent-light)'; btn.style.color = 'var(--accent)'; }
}

function submitClarify() {
  const blocking = window._clarifyBlocking || [];
  const confirm = {};
  blocking.forEach((b, i) => {
    if (b.field === 'city') {
      const el = document.getElementById('clarify-in-' + i);
      const typed = el ? el.value.trim() : '';
      confirm.city = typed || clarifyAnswers[b.field] || '__none__';
    } else if (b.field === 'dstMode') {
      confirm.dstMode = clarifyAnswers[b.field] || 'auto';
    } else if (b.field.indexOf('sect.') === 0) {
      confirm.sect = confirm.sect || {};
      const v = clarifyAnswers[b.field];
      if (v) confirm.sect[b.field.slice(5)] = v;
    }
  });
  return runInterpret({ ...window._clarifyPayload, confirm });
}

function skipClarify() {
  return runInterpret({ ...window._clarifyPayload, force: true });
}

async function runInterpret({ dateStr, hour, gender, city, domains, rectified, confirm, force }) {
  const btn = document.getElementById('go');
  const result = document.getElementById('result');
  btn.disabled = true;
  result.innerHTML = '<div class="card status">排盘中（确定性算法）→ AI 解读中（约 20-40 秒）…</div>';
  try {
    const resp = await fetch('/api/interpret', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dateStr, hour: hour ?? null, gender, city, domains, confirm, force })
    });
    const data = await resp.json();
    if (resp.status === 422 && data.needConfirm) { renderClarify({ dateStr, hour, gender, city, domains, rectified }, data); return; }
    if (data.error) throw new Error(data.error);
    if (data.complianceFailed) {
      result.innerHTML = `<div class="card err"><strong>本次解读未通过合规校验，已拦��不予输出。</strong><br>
        未通过项：${esc((data.problems || []).join('；'))}<br>
        <span style="font-size:13px">系统宁可不给结论，也不输出无依据或引起焦虑的内容。请稍后重试一次。</span></div>`;
      btn.disabled = false;
      return;
    }
    result.innerHTML = renderResultBody(data, { sessionId: data.sessionId });
    window._lastSessionId = data.sessionId || null;
    window._lastPayload = { input: { dateStr, hour: hour ?? null, gender, city, domains, rectified: !!rectified,
      sect: data.chart?.meta?.sect, sectStamp: data.sectStamp, trueSolar: data.chart?.meta?.trueSolar,
      warnings: data.preflightWarnings || [] }, report: data.report };
    // 归档成功后刷新抽屉角标，让人看得出「这次存进去了」
    if (data.sessionId) refreshHistCount();
  } catch (e) {
    result.innerHTML = `<div class="card err">出错了：${esc(e.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
}

/**
 * 渲染一次解读的完整结果（排盘 + 互证合成 + 报告 + 反馈区）。
 * 新解读与历史档案共用同一条渲染路径 —— 复制两份必然日后改一处漏一处。
 * data 形如 /api/interpret 的响应，或会话档案里的 chart/synthesis/report 字段。
 */
function renderResultBody(data, opts = {}) {
  {
    const p = data.chart.bazi.pillars;
    let html = `<div class="card"><h3 style="color:var(--accent);letter-spacing:4px;margin-bottom:4px">八字四柱</h3>`;
    if (data.chart.meta.trueSolar) html += `<p style="font-size:12px;color:var(--muted)">真太阳时校正：${esc(data.chart.meta.trueSolar.note)}</p>`;
    if (data.sectStamp) html += `<p style="font-size:12px;color:var(--muted)">排盘口径：${esc(data.sectStamp)}</p>`;
    const pfw = data.preflightWarnings || [];
    if (pfw.length) html += `<div style="margin-top:8px;padding:8px 12px;background:#fdf6e8;border:1px solid #ecdcb8;border-radius:8px">
      ${pfw.map(w => `<p style="font-size:12px;color:#8a6d2f">⚠ ${esc(w)}</p>`).join('')}</div>`;
    html += `<div class="chart-grid">`;
    for (const [name, gz] of [['年柱',p.year],['月柱',p.month],['日柱',p.day],['时柱',p.hour ?? '待定']]) {
      html += `<div class="pillar"><div class="t">${name}</div><div class="gz">${esc(gz)}</div></div>`;
    }
    html += `</div>`;
    const fe = data.chart.bazi.fiveElementsCount;
    html += `<div style="margin-top:14px" class="zx-row"><span>五行分布</span><span>${Object.entries(fe).map(([k,v])=>k+':'+v).join('　')}</span></div>`;
    if (!data.chart.ziwei.skipped) {
      const kp = data.chart.ziwei.keyPalaces;
      html += `<h3 style="color:var(--accent);letter-spacing:4px;margin:18px 0 8px">紫微关键宫位（${esc(data.chart.ziwei.soul)} 命 · ${esc(data.chart.ziwei.fiveElementsClass)}）</h3>`;
      for (const [k, label] of [['ming','命宫'],['guanLu','官禄'],['caiBo','财帛'],['fuQi','夫妻'],['jiE','疾厄']]) {
        const pal = kp[k];
        if (!pal) continue;
        const stars = pal.majorStars.map(s => s.name + (s.magnitude?`[${s.magnitude}]`:'') + (s.siHua?`(${s.siHua})`:'')).join(' ');
        html += `<span class="palace"><strong>${label}</strong> ${esc(stars || '无主星')}</span>`;
      }
    } else {
      html += `<p style="margin-top:14px;color:var(--muted);font-size:14px">时辰未定，紫微未排 —— 本次为八字单术解读（B 级精度）</p>`;
    }
    // 互证合成 · 各领域置信度
    if (data.synthesis && data.synthesis.results) {
      const DN = { career: '事业', wealth: '财帛', marriage: '婚姻', health: '健康', annual: '流年' };
      const DCN = { favorable: '利', unfavorable: '需留意', neutral: '平稳' };
      const VCN = { consistent: '双术一致', 'single-method': '单术信号', conditional: '双术冲突' };
      html += `<h3 style="color:var(--accent);letter-spacing:4px;margin:18px 0 4px">互证合成</h3>`;
      html += `<div>`;
      for (const r of data.synthesis.results) {
        const cls = r.direction === 'neutral' ? 'neutral' : r.confidence;
        html += `<span class="conf-chip ${cls}"><strong>${DN[r.domain] || r.domain}</strong> ${DCN[r.direction] || r.direction} · ${VCN[r.verdict] || r.verdict}（置信度：${r.confidence === 'high' ? '高' : r.confidence === 'medium' ? '中' : r.confidence === 'conditional' ? '条件式' : '中'}）</span>`;
      }
      html += `</div><p style="font-size:12px;color:var(--muted);margin-top:6px">双术一致 → 置信度高；单术有信号 → 中；双术冲突 → 条件式结论（正文中以「若…则…」呈现）</p>`;
    }
    const stamp = data.sectStamp ? `<p style="margin-top:20px;padding-top:12px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted);letter-spacing:1px">本盘口径：${esc(data.sectStamp)}</p>` : '';
    const archived = opts.sessionId
      ? `<p style="font-size:12px;color:var(--muted);margin-top:10px">评价与补充会写回档案 <code>${esc(opts.sessionId)}</code>，日后可按「不准」检索复盘。</p>`
      : '';
    html += `</div><div class="card report"><h2 style="letter-spacing:4px;color:var(--accent)">解读报告</h2><p style="font-size:12px;color:var(--muted);margin-bottom:8px">模型：${esc(data.model || '-')} · tokens：${data.usage?.total_tokens ?? '-'} · 知识库条文：${(data.passages && data.passages.length) ? data.passages.length + ' 条' : '未启用'}</p><div class="report-body">${mdLite(data.report)}</div>${stamp}
      <div style="margin-top:24px;border-top:1px dashed var(--line);padding-top:16px;text-align:center" id="fb-area">
        <span style="font-size:13px;color:var(--muted);margin-right:10px">这份解读对你有参考价值吗？</span>
        <button class="fb-btn" onclick="sendFeedback('good')">有帮助</button>
        <button class="fb-btn" onclick="sendFeedback('bad')">不准/没帮助</button>
        <div style="margin-top:12px">
          <input id="fb-facts" type="text" value="${esc(opts.facts || '')}" placeholder="可选：补充真实情况（如「2020年确实换了行业」），用于校正解读规则"
                 style="width:100%;max-width:520px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fdfcfa;font-family:inherit">
        </div>${archived}
      </div></div>`;
    return html;
  }
}

// ───────────────── 历史档案抽屉 ─────────────────
// 每次解读自动归档到 data/sessions.jsonl（后端 /api/sessions）。
// 攒 badcase 的价值全在「能不能翻出来」——所以这里把检索、备注、评价、补事实都做进界面。
let histRating = '';

function toggleHistory(on) {
  const drawer = document.getElementById('hist-drawer');
  const mask = document.getElementById('hist-mask');
  const next = on === undefined ? !drawer.classList.contains('on') : !!on;
  drawer.classList.toggle('on', next);
  mask.classList.toggle('on', next);
  if (next) { loadHistory(); refreshHistCount(); }
}

function pickRating(r) {
  histRating = r;
  document.querySelectorAll('#hist-filters .chip').forEach(c => c.classList.toggle('on', c.dataset.rating === r));
  loadHistory();
}

async function refreshHistCount() {
  try {
    const resp = await fetch('/api/sessions?action=stats');
    if (!resp.ok) return;
    const s = await resp.json();
    document.getElementById('hist-count').textContent = s.total ?? 0;
    const g = s.byRating?.good || 0, b = s.byRating?.bad || 0;
    document.getElementById('hist-sub').textContent =
      `共 ${s.total} 条 · 已评价 ${g + b}（准 ${g} / 不准 ${b}）· 带回真实事实 ${s.withFacts || 0} 条`
      + (s.badLines ? ` · 坏行 ${s.badLines} 条（需修）` : '');
  } catch (e) { /* 服务没启动时静默，按钮角标保持 0 */ }
}

async function loadHistory() {
  const list = document.getElementById('hist-list');
  const q = (document.getElementById('hist-q').value || '').trim();
  const params = new URLSearchParams({ limit: '50' });
  if (q) params.set('q', q);
  if (histRating) params.set('rating', histRating);
  try {
    const resp = await fetch('/api/sessions?' + params.toString());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    renderHistList(data);
  } catch (e) {
    list.innerHTML = `<div class="hist-empty">读取失败：${esc(e.message)}<br>服务没启动时就会这样</div>`;
  }
}

function renderHistList(data) {
  const list = document.getElementById('hist-list');
  const items = data.items || [];
  if (!items.length) {
    const filtered = histRating || (document.getElementById('hist-q').value || '').trim();
    list.innerHTML = `<div class="hist-empty">${filtered ? '没有符合条件的档案' : '还没有归档记录。<br>跑一次解读就会自动存进来。'}</div>`;
    return;
  }
  const RB = { good: '<span class="badge good">有帮助</span>', bad: '<span class="badge bad">不准</span>' };
  list.innerHTML = items.map(it => {
    const when = (it.ts || '').replace('T', ' ').slice(0, 16);
    const inp = it.input || {};
    const who = [inp.dateStr, inp.hour != null ? inp.hour + ' 时' : '时辰未定', inp.gender, inp.city].filter(Boolean).join(' · ');
    const idx = it.index || {};
    const l2 = [idx.pillars, idx.dayMaster ? '日主 ' + idx.dayMaster : '', idx.mingStar ? '命宫 ' + idx.mingStar : '',
      idx.ziweiSkipped ? '紫微未排' : ''].filter(Boolean).join(' · ');
    return `<div class="hist-item" onclick="openSession('${esc(it.id)}')">
      <div class="l1"><span class="who">${esc(who || '未命名')}</span><span class="when">${esc(when)}</span></div>
      <div class="l2">${esc(l2)}</div>
      ${it.note ? `<div class="note">备注：${esc(it.note)}</div>` : ''}
      ${it.facts ? `<div class="note">真实情况：${esc(it.facts)}</div>` : ''}
      <div class="hist-actions" onclick="event.stopPropagation()">
        ${RB[it.rating] || '<span class="badge none">待评价</span>'}
        <span class="spacer"></span>
        <button class="mini-btn" onclick="openSession('${esc(it.id)}')">打开</button>
        <button class="mini-btn danger" onclick="deleteSession('${esc(it.id)}')">删除</button>
      </div></div>`;
  }).join('') + ((data.total > items.length)
    ? `<p style="text-align:center;color:var(--muted);font-size:12px;margin-top:12px">仅显示最近 ${items.length} 条，共 ${data.total} 条 —— 用搜索缩小范围</p>` : '');
}

/** 打开一份档案：完整排盘 + 报告 + 备注/评价/补事实。quiet=true 时不跳回顶部（用于原地刷新） */
async function openSession(id, quiet) {
  const result = document.getElementById('result');
  const y = window.scrollY;
  if (!quiet) {
    result.innerHTML = '<div class="card status">读取档案…</div>';
    toggleHistory(false);
  }
  try {
    const resp = await fetch('/api/sessions/' + encodeURIComponent(id));
    const s = await resp.json();
    if (!resp.ok) throw new Error(s.error || ('HTTP ' + resp.status));
    window._lastSessionId = s.id;
    window._lastPayload = { input: s.input, report: s.report };
    const RB = { good: '<span class="badge good">已标：有帮助</span>', bad: '<span class="badge bad">已标：不准</span>' };
    const bar = `<div class="card">
      <h3 style="color:var(--accent);letter-spacing:4px;margin-bottom:6px">历史档案</h3>
      <p style="font-size:12px;color:var(--muted)">档案号 ${esc(s.id)} · 归档于 ${esc((s.ts || '').replace('T', ' ').slice(0, 19))}${s.meta && s.meta.model ? ' · 模型 ' + esc(s.meta.model) : ''}</p>
      <div style="margin-top:12px">${RB[s.rating] || '<span class="badge none">尚未评价</span>'}</div>
      <textarea id="sess-note" class="note-input" rows="2" placeholder="备注：是谁的盘、当时想看什么、后来验证了什么">${esc(s.note || '')}</textarea>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="mini-btn" onclick="saveNote('${esc(s.id)}')">保存备注</button>
        <button class="mini-btn" onclick="rateSession('${esc(s.id)}','good')">有帮助</button>
        <button class="mini-btn" onclick="rateSession('${esc(s.id)}','bad')">不准</button>
        <button class="mini-btn" onclick="rateSession('${esc(s.id)}','')">清除评价</button>
        <span class="spacer" style="flex:1"></span>
        <button class="mini-btn danger" onclick="deleteSession('${esc(s.id)}')">删除档案</button>
      </div></div>`;
    result.innerHTML = bar + renderResultBody({
      chart: s.chart, synthesis: s.synthesis, report: s.report,
      model: s.meta && s.meta.model, usage: s.meta && s.meta.usage,
      passages: s.meta && s.meta.passages, sectStamp: s.sectStamp,
      preflightWarnings: s.preflightWarnings,
      degraded: s.meta && s.meta.degraded,
    }, { sessionId: s.id, facts: s.facts });
    result.dataset.showing = s.id;   // 让「删除档案」知道当前页面展示的就是这份，可以清空
    if (quiet) window.scrollTo(0, y); else window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    result.innerHTML = `<div class="card err">读取失败：${esc(e.message)}</div>`;
  }
}

async function patchSession(id, patch, { reload = false } = {}) {
  try {
    const resp = await fetch('/api/sessions/' + encodeURIComponent(id), {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch),
    });
    const d = await resp.json();
    if (!resp.ok) throw new Error(d.error || ('HTTP ' + resp.status));
    toast('已保存');
    refreshHistCount();
    if (reload) openSession(id, true);
  } catch (e) {
    toast('保存失败：' + e.message);
  }
}

function saveNote(id) {
  const el = document.getElementById('sess-note');
  return patchSession(id, { note: el ? el.value : '' });
}

function rateSession(id, rating) {
  return patchSession(id, { rating: rating || null }, { reload: true });
}

async function deleteSession(id) {
  if (!confirm('删除这份档案？报告正文与备注一并删除，不可恢复。')) return;
  try {
    const resp = await fetch('/api/sessions/' + encodeURIComponent(id), { method: 'DELETE' });
    const d = await resp.json();
    if (!resp.ok) throw new Error(d.error || ('HTTP ' + resp.status));
    toast('已删除');
    if (window._lastSessionId === id) { window._lastSessionId = null; }
    loadHistory(); refreshHistCount();
    const result = document.getElementById('result');
    if (result.dataset.showing === id) result.innerHTML = '<div class="card status">档案已删除</div>';
  } catch (e) { toast('删除失败：' + e.message); }
}

function toast(msg) {
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#2b2620;color:#fdfcfa;' +
    'padding:9px 20px;border-radius:999px;font-size:13px;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.18)';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1800);
}

// 页面加载时先把角标取回来，别让人以为没有历史
refreshHistCount();
</script>
</body>
</html>
